{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Smart Building{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}">
    <script src="{% static 'dashboard/main.js' %}" defer></script>
</head>

<body>
    <header>
        <h1>AI-Driven Smart Building Dashboard</h1>
    </header>

    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="{% url 'lighting' %}">Lighting</a></li>
                <li><a href="{% url 'hvac' %}">HVAC</a></li>
                <li><a href="{% url 'security' %}">Security</a></li>
                <li><a href="{% url 'water' %}">Water</a></li>
                <li><a href="{% url 'waste' %}">Waste</a></li>
                <li><a href="{% url 'energy' %}">Energy</a></li>
            </ul>
        </aside>

        <main class="dashboard">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
